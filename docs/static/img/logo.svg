<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Candlestick chart icon (left side) -->
  <!-- Candlestick 1 - bullish (green) -->
  <rect x="10" y="20" width="5" height="20" rx="1" fill="#10b981"/>
  <line x1="12.5" y1="14" x2="12.5" y2="20" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="12.5" y1="40" x2="12.5" y2="44" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

  <!-- Candlestick 2 - bearish (blue) -->
  <rect x="20" y="16" width="5" height="18" rx="1" fill="#1e40af"/>
  <line x1="22.5" y1="8" x2="22.5" y2="16" stroke="#1e40af" stroke-width="2" stroke-linecap="round"/>
  <line x1="22.5" y1="34" x2="22.5" y2="40" stroke="#1e40af" stroke-width="2" stroke-linecap="round"/>

  <!-- Candlestick 3 - bullish (green) -->
  <rect x="30" y="12" width="5" height="22" rx="1" fill="#10b981"/>
  <line x1="32.5" y1="6" x2="32.5" y2="12" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="32.5" y1="34" x2="32.5" y2="40" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

  <!-- Trend line -->
  <path d="M10 38 Q20 30, 25 24 T35 14" fill="none" stroke="url(#grad)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,2" opacity="0.6"/>

  <!-- Letter "O" -->
  <text x="55" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#1e40af" letter-spacing="-1">O</text>

  <!-- Letter "D" -->
  <text x="85" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#10b981" letter-spacing="-1">D</text>

  <!-- "ptionDash" text -->
  <text x="115" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="currentColor" opacity="0.8" letter-spacing="-0.5">ptionDash</text>

  <!-- Small "wiki" badge -->
  <rect x="178" y="12" width="18" height="14" rx="3" fill="url(#grad)" opacity="0.15"/>
  <text x="187" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="url(#grad)" text-anchor="middle">wiki</text>
</svg>
